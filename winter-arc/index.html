<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Arc · Dear Brain</title>
<meta name="description" content="Choose a habit before your phone does. Pick your habits, do each one on 20 days in November, and share your Winter Arc card.">
<meta name="theme-color" content="#1f2a5c">
<meta name="apple-itunes-app" content="app-id=6816478121, app-argument=https://dearbrainapp.com/winter-arc">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gabarito:wght@700;800&display=swap">
<style>
:root { color-scheme: light; --ink: #111a3b; --ink-2: #414a6b; --muted: #858ba4; --brain: #f0727a; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; color: #fff; font: 400 1.0625rem/1.6 "Figtree", system-ui, sans-serif;
  background: linear-gradient(#1f2a5c, #45468f 55%, #9a8ddb); }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px) 64px; }
header { display: flex; align-items: center; gap: 10px; padding: 22px 0 8px; }
header a { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font: 800 1.25rem "Gabarito", system-ui, sans-serif; }
header img { width: 36px; height: 36px; border-radius: 9px; }
.hero { text-align: center; padding: 28px 0 8px; }
.flake { font-size: 3rem; line-height: 1; }
h1 { font: 800 clamp(2.4rem, 8vw, 3.2rem)/1.05 "Gabarito", system-ui, sans-serif; margin: 14px 0 8px; letter-spacing: -0.02em; }
.line { color: rgba(255,255,255,.85); font-size: 1.15rem; margin: 0; }
.card { background: #fff; color: var(--ink); border-radius: 24px; padding: 22px 22px 24px; margin-top: 28px; box-shadow: 0 14px 40px rgba(17,26,59,.25); }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; gap: 14px; padding: 8px 0; font-weight: 600; color: var(--ink); }
li span { flex: none; width: 32px; height: 32px; border-radius: 50%; background: #ecebfe; color: #776bf6; display: grid; place-items: center; font-weight: 700; }
.dates { color: var(--muted); font-size: .95rem; margin: 14px 0 18px; }
.button { display: block; text-align: center; background: #1c1c22; color: #fff; text-decoration: none; font: 700 1.1rem "Figtree", system-ui, sans-serif; padding: 16px; border-radius: 18px; box-shadow: 0 5px 0 #000; }
footer { margin-top: 36px; color: rgba(255,255,255,.7); font-size: .9rem; text-align: center; }
footer a { color: rgba(255,255,255,.85); margin: 0 8px; }
</style>
</head>
<body>
<div class="wrap">
<header><a href="/"><img src="/assets/apple-touch-icon.png" alt="">Dear Brain</a></header>
<main>
  <section class="hero">
    <div class="flake" aria-hidden="true">❄️</div>
    <h1>Winter Arc</h1>
    <p class="line">Choose a habit before your phone does.</p>
  </section>
  <section class="card">
    <ol>
      <li><span>1</span>Pick your habits</li>
      <li><span>2</span>Do each one on 20 days in November</li>
      <li><span>3</span>Share your Winter Arc card</li>
    </ol>
    <p class="dates">November 1 to 30. Free to join in the Dear Brain app.</p>
    <a class="button" href="https://apps.apple.com/app/id6816478121">Get Dear Brain</a>
  </section>
</main>
<footer><a href="/">Home</a><a href="/privacy/">Privacy</a><a href="/support/">Support</a></footer>
</div>
</body>
</html>
